[project]
name = "nasrcash-backend"
version = "0.1.0"
description = "NasrCash backend — wallet local, cartes virtuelles internationales (MVP sandbox)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
